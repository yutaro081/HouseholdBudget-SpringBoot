# メッセージの置き場所（設計書 4.3、6.8）。文字コードは UTF-8、日本語をそのまま書く。

# ---------------------------------------------------------------
# アカウント登録（RegisterForm）の入力チェック（設計書 6.2）
# キーは Spring の標準の付け方：注釈の名前.フォームの名前.項目名（G6）
# ---------------------------------------------------------------
NotBlank.registerForm.username=ユーザー名を入力してください
Pattern.registerForm.username=ユーザー名は半角英数字で入力してください
Size.registerForm.username=ユーザー名は10文字以内で入力してください
NotEmpty.registerForm.password=パスワードを入力してください
Pattern.registerForm.password=パスワードは半角の英数字と記号で入力してください
Size.registerForm.password=パスワードは8文字以上30文字以内で入力してください

# ---------------------------------------------------------------
# Service の結果・認証（error. から始める、G6）
# ---------------------------------------------------------------
error.duplicate.user=このユーザー名はすでに使われています
error.login.failed=ユーザー名またはパスワードが違います

# ---------------------------------------------------------------
# 成功メッセージ（設計書 2.3、2.6）
# ---------------------------------------------------------------
success.register=登録しました。ログインしてください
success.logout=ログアウトしました

# ---------------------------------------------------------------
# エラー画面（設計書 7.7）。詳しい中身は出さない
# ---------------------------------------------------------------
error.page.notFound=ページが見つかりません
error.page.forbidden=操作を完了できませんでした。もう一度やり直してください
error.page.clientError=操作を完了できませんでした。もう一度やり直してください
error.page.serverError=エラーが発生しました。しばらくしてからもう一度お試しください
error.page.backToTransactions=取引一覧へ戻る

# ---------------------------------------------------------------
# 科目・取引先・支払方法の入力チェック（設計書 6.2）。キーは 注釈の名前.フォームの名前.項目名（G6）
# ---------------------------------------------------------------
NotBlank.categoryForm.name=科目名を入力してください
Size.categoryForm.name=科目名は10文字以内で入力してください
NotBlank.vendorForm.name=取引先名を入力してください
Size.vendorForm.name=取引先名は20文字以内で入力してください
NotBlank.paymentMethodForm.name=支払方法名を入力してください
Size.paymentMethodForm.name=支払方法名は10文字以内で入力してください

# ---------------------------------------------------------------
# 名前の重複（Service の結果、設計書 5.6）
# ---------------------------------------------------------------
error.duplicate.category=その科目名はすでにあります
error.duplicate.vendor=その取引先名はすでにあります
error.duplicate.paymentMethod=その支払方法名はすでにあります

# ---------------------------------------------------------------
# 削除できない理由（設計書 5.5、要件4.3）
# ---------------------------------------------------------------
error.delete.inUse=取引で使われているため削除できません
error.delete.budgetNotZero=予算が0円ではない季節があるため削除できません

# ---------------------------------------------------------------
# 成功メッセージ（科目・取引先・支払方法で共通、設計書 2.6）
# ---------------------------------------------------------------
success.added=追加しました
success.updated=変更しました
success.deleted=削除しました

# ---------------------------------------------------------------
# 取引（TransactionForm）の入力チェック（設計書 6.2、3.3）。キーは 注釈の名前.フォームの名前.項目名（G6）
# typeMismatch は型変換のエラー。科目・取引先・支払方法の数字でない値は、未選択と同じ文言にする（G5）
# 日付の範囲の注釈の名前は TransactionDateRange（Q5-2 の A：自作の注釈。Phase 5 の 4.4 で作る）
# ---------------------------------------------------------------
NotNull.transactionForm.transactionDate=日付を入力してください
typeMismatch.transactionForm.transactionDate=日付を正しく入力してください
TransactionDateRange.transactionForm.transactionDate=日付は2000年3月1日から2100年12月31日までで入力してください
NotNull.transactionForm.amount=金額を入力してください
typeMismatch.transactionForm.amount=金額は整数で入力してください
Min.transactionForm.amount=金額は1円以上1,000,000円以下で入力してください
Max.transactionForm.amount=金額は1円以上1,000,000円以下で入力してください
NotNull.transactionForm.categoryId=科目を選択してください
typeMismatch.transactionForm.categoryId=科目を選択してください
NotNull.transactionForm.vendorId=取引先を選択してください
typeMismatch.transactionForm.vendorId=取引先を選択してください
NotNull.transactionForm.paymentMethodId=支払方法を選択してください
typeMismatch.transactionForm.paymentMethodId=支払方法を選択してください
Size.transactionForm.description=摘要は30文字以内で入力してください

# ---------------------------------------------------------------
# 取引の成功メッセージ（設計書 2.6、U2、Q5-8）。「削除しました」は success.deleted を使う
# ---------------------------------------------------------------
success.registered=登録しました
success.transactionUpdated=更新しました

# ---------------------------------------------------------------
# 予算（BudgetForm）の入力チェック（設計書 6.2、6.5）。行（rows）ごとの予算額。キーは 注釈の名前.フォームの名前.項目名（G6）
# 行の番号なしの形（rows.amount）で、どの行にも当たる想定。Phase 6 の 4.5 の実験で当たることを確かめて確定する（Q6-7）
# ---------------------------------------------------------------
NotNull.budgetForm.rows.amount=予算額を入力してください
typeMismatch.budgetForm.rows.amount=予算額は整数で入力してください
Min.budgetForm.rows.amount=予算額は0円以上3,000,000円以下で入力してください
Max.budgetForm.rows.amount=予算額は0円以上3,000,000円以下で入力してください

# ---------------------------------------------------------------
# 予算の成功メッセージ（設計書 2.6、U4、Q6-7）
# ---------------------------------------------------------------
success.saved=保存しました

# ---------------------------------------------------------------
# 季節の名前（予算設定・予実比較の見出しとリンク。画面の文言は messages.properties に置く、設計書 6.8、Q6-5）
# キーは season. ＋ URL の名前（Season.getUrlName）
# ---------------------------------------------------------------
season.spring=春
season.summer=夏
season.autumn=秋
season.winter=冬

# ---------------------------------------------------------------
# 個数の上限（Service の結果、設計書 5.4、6.2、R14）。科目・取引先・支払方法は、それぞれ1人あたり256個まで
# ---------------------------------------------------------------
error.limit.category=科目は256個までです
error.limit.vendor=取引先は256個までです
error.limit.paymentMethod=支払方法は256個までです
