# アプリの名前（Spring Initializr が付けたもの）
spring.application.name=household-budget

# DB の接続先・ユーザー名・パスワード。値は書かず、環境変数の名前だけを書く（設計書 1.5、7.9）
spring.datasource.url=${HB_DB_URL}
spring.datasource.username=${HB_DB_USER}
spring.datasource.password=${HB_DB_PASSWORD}

# 起動のたびに schema.sql を実行する（MySQL のような外部の DB では、これを書かないと実行されない。Q17）
spring.sql.init.mode=always

# テーブルは schema.sql で作るので、Hibernate にはテーブルの作成・変更をさせない
spring.jpa.hibernate.ddl-auto=none

# messages.properties を UTF-8 で読む（日本語の文字化けを防ぐ。6.8、C2）
spring.messages.encoding=UTF-8

# エラーの詳細（スタックトレース、例外のメッセージなど）を画面に含めない（7.7、S2）
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# セッションの Cookie（設計書 7.10、S1）。HttpOnly：JavaScript から読めない。SameSite=Lax：他のサイトからの POST に付かない。
# Secure は付けない（今は自分のパソコンの HTTP。インターネットへの公開は要件9章で対象外）
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# セッションIDを URL に出さない。Cookie だけで受け渡す（設計書 7.10、S8）。
# URL に出ると、履歴や画面のコピーから漏れるおそれがあり、Spring Security が ;jsessionid= の付いた URL を拒否して画面の CSS も読めなくなる
server.servlet.session.tracking-modes=cookie

# 画面を作っている間もデータベースの接続を持ち続ける機能（Open Session In View）を使わない（設計書 4.6、D5）。
# 標準は true だが、true だと、画面（テンプレート）の中で、読み込み忘れた関連を読みにいけてしまい、気づきにくい。
# false にすると、読み込み忘れは LazyInitializationException の失敗として見つかる。
# 取引の一覧・詳細は、Repository の @EntityGraph で、科目・取引先・支払方法をまとめて読み込んでいる（Phase 5 で true と false を比べて決めた）。
spring.jpa.open-in-view=false
