# アプリの名前（Spring Initializr が付けたもの）
spring.application.name=household-budget

# DB の接続先・ユーザー名・パスワード。値は書かず、環境変数の名前だけを書く（設計書 1.5、7.9）
spring.datasource.url=${HB_DB_URL}
spring.datasource.username=${HB_DB_USER}
spring.datasource.password=${HB_DB_PASSWORD}

# 起動のたびに schema.sql を実行する（MySQL のような外部の DB では、これを書かないと実行されない。Q17）
spring.sql.init.mode=always

# テーブルは schema.sql で作るので、Hibernate にはテーブルの作成・変更をさせない
spring.jpa.hibernate.ddl-auto=none

# messages.properties を UTF-8 で読む（日本語の文字化けを防ぐ。6.8、C2）
spring.messages.encoding=UTF-8

# エラーの詳細（スタックトレース、例外のメッセージなど）を画面に含めない（7.7、S2）
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
