<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/common :: header('transactions')}"></header>
<main class="container form-wide">
    <div th:replace="~{fragments/common :: messages}"></div>

    <!--/* 上の戻るリンク（issue 015 の 3 回目）。フォームの外に置くので、科目などが空でフォームを出さないときも出る */-->
    <p class="back-link"><a th:href="@{/transactions}">← 取引一覧に戻る</a></p>

    <h1 th:text="${pageTitle}">取引の登録</h1>

    <!--/* 登録（transactionId がない）と編集（transactionId がある）で共用する（設計書 4.4.2、U1：表示と送信は同じ URL）。
         992px 以上は 2 列（左：日付・科目・取引先・支払方法／右：金額・金額ボタン・摘要）、それより小さいときは 1 列（設計書 2.3、issue 015 の 3 回目）。
         HTML は「左の列 → 右の列」の順に書く（1 列のときの順と、Tab で進む順が、見た目の順と合う）。2 列は CSS（Bootstrap の row / col-lg-6）だけで作る。
         ラベルの横の「必須」「任意・30 文字以内」は表示だけ（required・maxlength は付けない、G1）。
         プルダウンが空のとき（B2、Q5-7 の A）は、足りない種類の説明とマスタの画面へのリンクを出し、フォームは出さない。
         入力欄には、カンマも「円」も使わない（2.3）。金額は文字として受け付ける（G1）。
         エラーで戻ったときも、入力値と選んでいた値が残る（th:field）。利用者の入力は th:field / th:text で出す。th:utext は使わない（7.5） */-->
    <!--/* 取引の複写（issue 012、U8）：複写で開いたときだけ出す固定の 1 行。利用者の入力は入れない。エラーで表示し直した画面には出ない */-->
    <p class="alert alert-info" th:if="${copied}">この取引を写しています。日付は今日にしてあります。「登録する」を押すまで、保存されません。</p>

    <div class="notice alert alert-warning" th:if="${#lists.isEmpty(categories) or #lists.isEmpty(vendors) or #lists.isEmpty(paymentMethods)}">
        <p th:if="${#lists.isEmpty(categories)}">先に科目を追加してください。<a th:href="@{/categories}">科目の画面へ</a></p>
        <p th:if="${#lists.isEmpty(vendors)}">先に取引先を追加してください。<a th:href="@{/vendors}">取引先の画面へ</a></p>
        <p th:if="${#lists.isEmpty(paymentMethods)}">先に支払方法を追加してください。<a th:href="@{/payment-methods}">支払方法の画面へ</a></p>
    </div>

    <form th:unless="${#lists.isEmpty(categories) or #lists.isEmpty(vendors) or #lists.isEmpty(paymentMethods)}"
          th:action="${transactionId == null} ? @{/transactions/new} : @{/transactions/{id}/edit(id=${transactionId})}"
          th:object="${transactionForm}" method="post" class="form-card" novalidate>
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="field">
                    <label class="form-label" for="transactionDate">日付 <span class="field-chip field-chip-required">必須</span></label>
                    <input class="form-control" type="date" th:field="*{transactionDate}">
                    <div class="field-error" th:each="message : ${#fields.errors('transactionDate')}" th:text="${message}">エラー</div>
                </div>

                <div class="field">
                    <label class="form-label" for="categoryId">科目 <span class="field-chip field-chip-required">必須</span></label>
                    <select class="form-select" th:field="*{categoryId}">
                        <option value="">選択してください</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">食費</option>
                    </select>
                    <div class="field-error" th:each="message : ${#fields.errors('categoryId')}" th:text="${message}">エラー</div>
                </div>

                <div class="field">
                    <label class="form-label" for="vendorId">取引先 <span class="field-chip field-chip-required">必須</span></label>
                    <select class="form-select" th:field="*{vendorId}">
                        <option value="">選択してください</option>
                        <option th:each="vendor : ${vendors}" th:value="${vendor.id}" th:text="${vendor.name}">コンビニ</option>
                    </select>
                    <div class="field-error" th:each="message : ${#fields.errors('vendorId')}" th:text="${message}">エラー</div>
                </div>

                <div class="field">
                    <label class="form-label" for="paymentMethodId">支払方法 <span class="field-chip field-chip-required">必須</span></label>
                    <select class="form-select" th:field="*{paymentMethodId}">
                        <option value="">選択してください</option>
                        <option th:each="paymentMethod : ${paymentMethods}" th:value="${paymentMethod.id}" th:text="${paymentMethod.name}">現金</option>
                    </select>
                    <div class="field-error" th:each="message : ${#fields.errors('paymentMethodId')}" th:text="${message}">エラー</div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="field">
                    <label class="form-label" for="amount">金額 <span class="field-chip field-chip-required">必須</span></label>
                    <input class="form-control amount-input" type="text" inputmode="numeric" th:field="*{amount}">
                    <div class="field-hint">円。1〜1000000の整数</div>
                    <div class="field-error" th:each="message : ${#fields.errors('amount')}" th:text="${message}">エラー</div>
                    <!--/* 金額の入力を助けるボタン（設計書 2.3、issue 009）。JavaScript が動いたときだけ見せる（hidden を外す）。
                         ボタンは type="button"（送信しない）。どの欄に効くかは data-amount-target で指す。税込のボタンは、画面を開いたとき欄に値が入っていれば、JavaScript が最初から押せなくする（編集画面、エラーで表示し直した画面）。
                         文は固定で、JavaScript は見せる・隠すだけ。利用者の入力は使わない（7.5）。入力欄の th:field は変えない。2 列のときは右の列の、金額の欄の下（中身は変えない） */-->
                    <div class="amount-buttons mt-2" data-amount-buttons data-amount-target="amount" hidden>
                        <div class="d-flex flex-wrap gap-2 mb-2">
                            <button type="button" class="btn btn-outline-secondary" data-amount-add="1">+1</button>
                            <button type="button" class="btn btn-outline-secondary" data-amount-add="10">+10</button>
                            <button type="button" class="btn btn-outline-secondary" data-amount-add="100">+100</button>
                            <button type="button" class="btn btn-outline-secondary" data-amount-add="1000">+1,000</button>
                            <button type="button" class="btn btn-outline-secondary" data-amount-add="10000">+10,000</button>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mb-2">
                            <button type="button" class="btn btn-outline-secondary" data-amount-tax="110">税込（10%）</button>
                            <button type="button" class="btn btn-outline-secondary" data-amount-tax="108">税込（8%）</button>
                            <button type="button" class="btn btn-outline-secondary ms-3" data-amount-clear>クリア</button>
                        </div>
                        <div class="form-text" data-amount-tax-note hidden>この金額には、もう税をかけられません。税抜きの金額を入れ直すと、押せるようになります。</div>
                        <div class="form-text">税込のボタンは、欄の金額を税抜として計算します（端数は切り捨て）。8%と10%が混ざるレシートは、税率ごとに取引を分けて登録してください。</div>
                    </div>
                </div>

                <div class="field">
                    <label class="form-label" for="description">摘要 <span class="field-chip field-chip-optional">任意・30 文字以内</span></label>
                    <input class="form-control" type="text" th:field="*{description}">
                    <div class="field-error" th:each="message : ${#fields.errors('description')}" th:text="${message}">エラー</div>
                </div>
            </div>
        </div>

        <!--/* 右下：キャンセル（取引一覧へのリンク。ボタンではないので、Enter キーでは送信されない）→ 送信ボタン */-->
        <div class="form-actions">
            <a class="btn btn-outline-secondary" th:href="@{/transactions}">キャンセル</a>
            <button type="submit" class="btn btn-primary" th:text="${transactionId == null} ? '登録する' : '更新'">登録する</button>
        </div>
    </form>

</main>
<script defer th:src="@{/js/amount-buttons.js}"></script>
</body>
</html>
