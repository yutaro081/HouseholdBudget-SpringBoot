<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('取引一覧')}"></head>
<body>
<header th:replace="~{fragments/common :: header('transactions')}"></header>
<main class="container list-wide">
    <!--/* 成功メッセージの表示場所（画面の上部、設計書 2.3） */-->
    <div th:replace="~{fragments/common :: messages}"></div>

    <!--/* 見出しの行（設計書 2.3、issue 017 の 2 回目）：左に見出しと件数の文、右に「＋ 取引を登録」。件数は、画面に渡した取引の数（全件表示なので全件数。Q017-13）。0 件のときは件数の文を出さない */-->
    <div class="page-head">
        <div>
            <h1>取引一覧</h1>
            <p class="page-sub" th:unless="${#lists.isEmpty(transactions)}" th:text="|日付の新しい順に、${#numbers.formatInteger(#lists.size(transactions), 1, 'COMMA')} 件を表示しています。|">日付の新しい順に、23 件を表示しています。</p>
        </div>
        <div class="page-head-actions">
            <a class="btn btn-primary" th:href="@{/transactions/new}"><th:block th:replace="~{fragments/icons :: icon('plus', 18, 2.4)}"></th:block>取引を登録</a>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(transactions)}">取引はまだありません</p>

    <!--/* 日付の新しい順（同じ日は登録の新しい順）。編集・削除のボタンは置かない（U3）。
         日付は 2026/10/19、金額は 30,000 の形（「円」は見出し「金額（円）」にまとめる。issue 024）（2.3、Q5-9）。利用者が入力した値は th:text で出す。th:utext は使わない（7.5） */-->
    <div class="list-card table-responsive" th:unless="${#lists.isEmpty(transactions)}">
        <table class="list table table-hover align-middle">
        <thead>
        <tr>
            <th>日付</th>
            <th>科目</th>
            <th>取引先</th>
            <th>支払方法</th>
            <th>摘要</th>
            <th class="num">金額（円）</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transaction : ${transactions}">
            <td class="list-muted" th:text="${#temporals.format(transaction.transactionDate, 'yyyy/MM/dd')}">2026/10/19</td>
            <td th:text="${transaction.category.name}">食費</td>
            <td th:text="${transaction.vendor.name}">コンビニ</td>
            <td class="list-muted" th:text="${transaction.paymentMethod.name}">現金</td>
            <td class="list-muted" th:text="${transaction.description}">昼食</td>
            <td class="num" th:text="${#numbers.formatInteger(transaction.amount, 1, 'COMMA')}">30,000</td>
            <td><a th:href="@{/transactions/{id}(id=${transaction.id})}">詳細</a></td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
