<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('取引先の変更')}"></head>
<body>
<header th:replace="~{fragments/common :: header('vendors')}"></header>
<main class="container narrow">
    <div th:replace="~{fragments/common :: messages}"></div>

    <h1>取引先の変更</h1>

    <!--/* 今の名前の入ったフォーム。入力エラー・重複のときは、この画面を表示し直し、入力値とエラーを入れる（設計書 6.9） */-->
    <form th:action="@{/vendors/{id}/edit(id=${vendorId})}" th:object="${vendorForm}" method="post" class="form-card" novalidate>
        <div class="field">
            <label class="form-label" for="name">取引先名 <span class="field-chip">20 文字以内</span></label>
            <input class="form-control" type="text" th:field="*{name}" autofocus>
            <div class="field-error" th:each="message : ${#fields.errors('name')}" th:text="${message}">エラー</div>
        </div>
        <!--/* 右下：キャンセル（一覧へのリンク）→ 保存。取引の登録・編集の画面と同じ並び（issue 025 の段階 5。区切り線の下） */-->
        <div class="form-actions">
            <a class="btn btn-outline-secondary" th:href="@{/vendors}">キャンセル</a>
            <button type="submit" class="btn btn-primary">保存</button>
        </div>
    </form>

</main>
</body>
</html>
