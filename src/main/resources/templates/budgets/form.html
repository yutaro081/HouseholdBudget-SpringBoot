<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('予算設定')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<main>
    <!--/* 成功メッセージ（保存しました）の表示場所（画面の上部、設計書 2.3） */-->
    <div th:replace="~{fragments/common :: messages}"></div>

    <h1>予算設定</h1>

    <!--/* 見出し（年・季節・期間）と、前・次の季節のリンク。範囲の端ではリンクを出さない（設計書 2.4）。予実比較と共有する部品 */-->
    <div th:replace="~{fragments/season :: nav(${budgetView.period}, ${budgetView.previous}, ${budgetView.next}, '/budgets')}"></div>

    <!--/* 科目が0件のときは、案内を出して、保存ボタンは出さない（設計書 2.3） */-->
    <div class="notice" th:if="${#lists.isEmpty(budgetView.rows)}">
        <p>先に科目を追加してください。<a th:href="@{/categories}">科目の画面へ</a></p>
    </div>

    <!--/* 科目ごとの予算額の入力。科目の登録順。保存先は、年と季節を含む URL（設計書 5.7）。
         入力欄には、カンマも「円」も使わない。数字だけを入力する（設計書 2.3）。画面側では必須・範囲の制限を付けない（G1）。
         「（この季節は未設定）」の印は、その季節の予算が保存されていない行に出す（Q26）。保存すると、全科目の行が作られ、印が消える。
         エラーのとき（表示し直し）は、全行の入力値が残り、エラーのある行の横にメッセージが出る（6.9）。
         科目名は th:text で出す。th:utext は使わない（7.5）。保存していない入力は、前・次の季節のリンクで移動すると、確認なしで捨てられる（Q27 の d） */-->
    <form th:unless="${#lists.isEmpty(budgetView.rows)}"
          th:action="@{/budgets(year=${budgetView.period.year}, season=${budgetView.period.season.urlName})}"
          th:object="${budgetForm}" method="post" novalidate>
        <table class="list budget-table">
            <thead>
            <tr>
                <th>科目</th>
                <th>予算額（円。0〜3000000の整数）</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, stat : ${budgetView.rows}">
                <td>
                    <span th:text="${row.categoryName}">食費</span>
                    <span class="unset-mark" th:if="${row.unset}">（この季節は未設定）</span>
                </td>
                <td>
                    <input type="hidden" th:name="|rows[${stat.index}].categoryId|" th:value="${row.categoryId}">
                    <input type="text" inputmode="numeric" th:field="*{rows[__${stat.index}__].amount}">
                    <div class="field-error" th:each="message : ${#fields.errors('rows[__${stat.index}__].amount')}"
                         th:text="${message}">エラー</div>
                </td>
            </tr>
            </tbody>
        </table>
        <button type="submit">保存</button>
    </form>
</main>
</body>
</html>
