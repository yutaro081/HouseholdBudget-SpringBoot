<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('操作を完了できませんでした')}"></head>
<body>
<!--/*
  403 の専用画面（設計書 7.7、S3）。Spring Boot が、状態コードが 403 のときに自動で使う。
  CSRF のトークンがない・違う POST などで表示される。
  ・エラーの詳しい中身は、一切出さない。
  ・ログイン前でも表示できる。そのため、ログイン中のユーザー名は出さない。
*/-->
<main class="narrow">
    <h1 th:text="#{error.page.forbidden}">操作を完了できませんでした。もう一度やり直してください</h1>
    <p><a th:href="@{/transactions}" th:text="#{error.page.backToTransactions}">取引一覧へ戻る</a></p>
</main>
</body>
</html>
