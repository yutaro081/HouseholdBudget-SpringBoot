<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('ページが見つかりません')}"></head>
<body>
<!--/*
  404 の専用画面（設計書 2.5、7.7、B7）。Spring Boot が、状態コードが 404 のときに自動で使う。
  ・エラーの詳しい中身（例外・スタックトレース・SQL・ファイルのパスなど）は、一切出さない。
  ・ログイン前でも表示できる（/error はログインなしで開ける、7.3）。そのため、ログイン中のユーザー名は出さない。
  ・存在しない URL、存在しない・他人のID、範囲外の年・不正な季節は、すべてこの同じ画面になる（7.8）。
*/-->
<main class="narrow">
    <h1 th:text="#{error.page.notFound}">ページが見つかりません</h1>
    <p><a th:href="@{/transactions}" th:text="#{error.page.backToTransactions}">取引一覧へ戻る</a></p>
</main>
</body>
</html>
