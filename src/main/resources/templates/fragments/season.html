<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!--/*
  季節の見出しと、「前の季節」「次の季節」のリンク、真ん中の「今の季節」ボタン（設計書 2.3、2.4、4.4.2、Q6-5）。
  予算設定（/budgets）と予実比較（/comparison）で共有する。リンクの先の URL は、引数 path で渡す。
  ・period：表示する季節（SeasonPeriod）。previous / next：前・次の季節。範囲の端（2000年春の前、2100年冬の次）では null で、リンクを出さない（B15）。
  ・見出しは「2026年 春（3月〜5月）」。冬は年をまたぐので「2026年 冬（2026年12月〜2027年2月）」。
  ・季節の名前（春・夏・秋・冬）は messages.properties（season.spring など）。
  ・リンクの URL は、年と季節（spring など）を含む。値はすべて数字と固定の英字で、利用者の入力ではない。
  ・「今の季節」ボタン（Phase 8 の issue 007、設計書 2.4）：前後のリンクと同じ行の真ん中（見出しの下）に出す。見た目は前後のリンクと同じボタン。
    行き先は、季節を指定しない URL（path のまま。?year=… を付けない）で、開くと今日が属する季節が表示される。今の季節を見ているときも、範囲の端でも出す（th:if を付けない）。
  ・年と季節を選ぶ欄（GET のフォーム。Phase 8 の G1、設計書 2.4）：年は 2000〜2100（SeasonPeriod.FIRST_YEAR・LAST_YEAR と同じ。テストで確かめる、Q8-15）、季節は 4 つ。
    送る先は path で、リンクと同じ形（?year=…&season=…）。受け取りと 404 の判定は SeasonPeriod.resolve のまま。何も変えないので CSRF のトークンは要らない。JavaScript は使わない。
*/-->
<th:block th:fragment="nav(period, previous, next, path)">
<div class="season-nav">
    <span class="season-link prev">
        <a class="btn btn-outline-secondary btn-sm" th:if="${previous != null}"
           th:href="@{${path}(year=${previous.year}, season=${previous.season.urlName})}">前の季節</a>
    </span>
    <div class="season-center">
        <h2 class="season-title">
            <span th:text="|${period.year}年 #{season.__${period.season.urlName}__}|">2026年 春</span>
            <span th:if="${period.season.urlName != 'winter'}"
                  th:text="|（${period.startDate.monthValue}月〜${period.endDateExclusive.minusMonths(1).monthValue}月）|">（3月〜5月）</span>
            <span th:if="${period.season.urlName == 'winter'}"
                  th:text="|（${period.startDate.year}年${period.startDate.monthValue}月〜${period.endDateExclusive.minusMonths(1).year}年${period.endDateExclusive.minusMonths(1).monthValue}月）|">（2026年12月〜2027年2月）</span>
        </h2>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{${path}}">今の季節</a>
    </div>
    <span class="season-link next">
        <a class="btn btn-outline-secondary btn-sm" th:if="${next != null}"
           th:href="@{${path}(year=${next.year}, season=${next.season.urlName})}">次の季節</a>
    </span>
</div>
<form method="get" th:action="@{${path}}" class="season-select">
    <label class="form-label mb-0" for="season-year">年</label>
    <select class="form-select form-select-sm w-auto" id="season-year" name="year">
        <option th:each="y : ${#numbers.sequence(2000, 2100)}"
                th:value="${y}" th:text="|${y}年|" th:selected="${y == period.year}">2026年</option>
    </select>
    <label class="form-label mb-0" for="season-name">季節</label>
    <select class="form-select form-select-sm w-auto" id="season-name" name="season">
        <option th:each="name : ${ {'spring', 'summer', 'autumn', 'winter'} }"
                th:value="${name}" th:text="#{|season.${name}|}" th:selected="${name == period.season.urlName}">春</option>
    </select>
    <button type="submit" class="btn btn-primary btn-sm">表示</button>
    <span class="season-hint">冬は、12月がある年を選びます</span>
</form>
</th:block>
</html>
