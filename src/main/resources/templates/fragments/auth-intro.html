<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!--/*
  ログイン・アカウント登録の左の紹介（設計書 2.3、4.4.2、issue 017 の 2 回目。Q017-9）。2 画面で同じものを使う。
  ・紹介は日本語だけにする（登録エラーのテストが、英字で「パスワードが残っていない」ことを調べるため）。入力欄・フォームは置かない。
  ・💮 の文は、予実比較の決まり（予算の 1/3 を超え、予算以下。要件定義書 4.4）と同じ言い方（Q017-11）。
  ・チェックの印は固定のアイコン（fragments/icons.html の check）。利用者の入力は混ざらない。
*/-->
<section th:fragment="intro" class="auth-intro">
    <span class="auth-chip">季節ごとの家計簿</span>
    <h1 class="auth-title">予算と実績を、<br>3 か月ごとにふり返る。</h1>
    <p class="auth-lead">取引を記録すると、季節（春・夏・秋・冬）ごとに、科目別の予算と実績が並びます。予算の 1/3 を超えて、予算以内に収まった科目には 💮 が付きます。</p>
    <ul class="auth-points">
        <li><span class="auth-check"><th:block th:replace="~{fragments/icons :: icon('check', 12, 2.6)}"></th:block></span>自分のデータは、自分だけが見られます</li>
        <li><span class="auth-check"><th:block th:replace="~{fragments/icons :: icon('check', 12, 2.6)}"></th:block></span>科目・取引先・支払方法は、自由に追加できます</li>
    </ul>
</section>
</html>
