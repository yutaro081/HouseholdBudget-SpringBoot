<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!--/*
  アイコンの部品（設計書 2.3「アイコン」、4.4.2、7.5、issue 017）。自作の線の SVG。ライブラリは使わない。
  ・使い方：<th:block th:replace="~{fragments/icons :: icon('top', 18, 2)}"></th:block>
    （名前, 大きさ[px], 線の太さ）。名前は固定の文字だけで渡す（利用者の入力は使わない）。知らない名前では、何も出さない。
  ・14 個：logo、メニューの 7 つ（top、transactions、categories、vendors、payment-methods、budgets、comparison）、plus、sun、pie、check（ログイン・登録の紹介のチェックの印）、sparkle（予算設定の「自動予算」ボタン。issue 019）、flower（「予算内」のチップの花。issue 024。ほかと違って、塗りの花：花びら #F0A060、中心 #FFF8EE、中心の縁 #B4571A。飾りの色で、意味は持たせない）。
  ・飾りなので aria-hidden="true"（意味は、隣の文字で伝わる）。色は currentColor（文字の色に合わせる）。ただし flower だけは、塗りの花で、色を SVG の中に固定で書く（小さいと、線の花は星に見えるため）。
  ・xmlns、style 属性、script、use、image、外部の URL は書かない（テストが確かめる）。
  ・<svg> の前後に空白を入れない（<a> の中の文字との間に余白ができるため）。
*/-->
<th:block th:fragment="icon(name, size, stroke)"><svg th:if="${name == 'logo' or name == 'top' or name == 'transactions' or name == 'categories' or name == 'vendors' or name == 'payment-methods' or name == 'budgets' or name == 'comparison' or name == 'plus' or name == 'sun' or name == 'pie' or name == 'check' or name == 'sparkle' or name == 'flower'}" th:attr="width=${size},height=${size},stroke-width=${stroke}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><th:block th:switch="${name}">
<th:block th:case="'logo'"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path><path d="M7 15h4"></path></th:block>
<th:block th:case="'top'"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></th:block>
<th:block th:case="'transactions'"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></th:block>
<th:block th:case="'categories'"><path d="M20 12l-8 8-9-9V3h8z"></path><path d="M7.5 7.5h.01"></path></th:block>
<th:block th:case="'vendors'"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></th:block>
<th:block th:case="'payment-methods'"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><path d="M2 10h20"></path></th:block>
<th:block th:case="'budgets'"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10"></path><path d="M9 9.5h4.5a1.75 1.75 0 0 1 0 3.5h-3a1.75 1.75 0 0 0 0 3.5H15"></path></th:block>
<th:block th:case="'comparison'"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></th:block>
<th:block th:case="'plus'"><path d="M12 5v14"></path><path d="M5 12h14"></path></th:block>
<th:block th:case="'sun'"><path d="M12 3v3"></path><path d="M12 18v3"></path><path d="M5.6 5.6l2.1 2.1"></path><path d="M16.3 16.3l2.1 2.1"></path><path d="M3 12h3"></path><path d="M18 12h3"></path><circle cx="12" cy="12" r="3.5"></circle></th:block>
<th:block th:case="'pie'"><path d="M21 12a9 9 0 1 1-9-9v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></th:block>
<th:block th:case="'check'"><path d="M5 12l5 5 9-10"></path></th:block>
<th:block th:case="'sparkle'"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path><path d="M19 3v4"></path><path d="M17 5h4"></path></th:block>
<th:block th:case="'flower'"><g fill="#F0A060" stroke="none"><circle cx="12" cy="6.3" r="4.3"></circle><circle cx="17.4" cy="10.2" r="4.3"></circle><circle cx="15.3" cy="16.6" r="4.3"></circle><circle cx="8.7" cy="16.6" r="4.3"></circle><circle cx="6.6" cy="10.2" r="4.3"></circle></g><circle cx="12" cy="12" r="3.2" fill="#FFF8EE" stroke="#B4571A" stroke-width="1.6"></circle></th:block>
</th:block></svg></th:block>
</html>
