<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  共通の画面の枠（設計書 4.4.2、P5）。Thymeleaf のフラグメント（部品の読み込み）で、全画面が共有する。
  ・利用者が入力した値は、すべて th:text（または sec:authentication）で表示する。th:utext は使わない（7.5）。
*/-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">タイトル</title>
    <!--/* Bootstrap の CSS（アプリの中に置く。CDN は使わない。JavaScript は入れない。設計書 1.2）を先に、自作の CSS を後に読む */-->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!--/* 「戻る」で覚えていた画面が出たとき、開き直す短い JavaScript（別ファイル。設計書 7.10）。ログイン前の画面でも読むので /js/** は誰でも開ける（7.3） */-->
    <script defer th:src="@{/js/back-reload.js}"></script>
</head>
<body>

<!--/* ヘッダー（ログイン後の全画面）：ロゴ、アイコンつきのメニュー、ログイン中のユーザー名（＋「さん」）、ログアウトボタン（2.3、issue 017）。
     メニューは、作った画面の分だけ出す（Q3-4）。今開いている画面の項目には、aria-current="page" を付ける（クラスは付けない。issue 015）。
     どの項目かは、各画面が header('transactions') のように、決まった文字で渡す（利用者の入力は使わない）。ログアウトは POST のフォーム。th:action で CSRF のトークンが自動で入る（7.6） */-->
<header th:fragment="header(current)" class="app-header bg-body-tertiary border-bottom">
    <div class="app-header-inner">
        <!--/* ロゴ：角丸の四角に白い線のアイコン（地は主ボタンの地の色）＋アプリの名前。押すとトップへ */-->
        <th:block th:replace="~{:: brand}"></th:block>
        <nav class="menu d-flex flex-wrap">
            <a th:href="@{/}" th:attr="aria-current=${current == 'top'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('top', 18, 2)}"></th:block>トップ</a>
            <a th:href="@{/transactions}" th:attr="aria-current=${current == 'transactions'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('transactions', 18, 2)}"></th:block>取引一覧</a>
            <a th:href="@{/categories}" th:attr="aria-current=${current == 'categories'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('categories', 18, 2)}"></th:block>科目</a>
            <a th:href="@{/vendors}" th:attr="aria-current=${current == 'vendors'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('vendors', 18, 2)}"></th:block>取引先</a>
            <a th:href="@{/payment-methods}" th:attr="aria-current=${current == 'payment-methods'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('payment-methods', 18, 2)}"></th:block>支払方法</a>
            <a th:href="@{/budgets}" th:attr="aria-current=${current == 'budgets'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('budgets', 18, 2)}"></th:block>予算設定</a>
            <a th:href="@{/comparison}" th:attr="aria-current=${current == 'comparison'} ? 'page'"><th:block th:replace="~{fragments/icons :: icon('comparison', 18, 2)}"></th:block>予実比較</a>
        </nav>
        <div class="user-area d-flex align-items-center gap-2">
            <span class="user-name"><span sec:authentication="name">ユーザー名</span><span class="user-honorific">さん</span></span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
            </form>
        </div>
    </div>
</header>

<!--/* ロゴの小部品（ログイン後のヘッダーと、ログイン前のヘッダー〔fragments/public-header.html〕が共有する。issue 017 の 2 回目）。
     注意：このファイルに <header> 要素を、もう 1 つ置かない。Thymeleaf は header(...) の「header」を、部品の名前だけでなく要素の名前としても探すので、
     ログイン後の全画面に、もう 1 つの <header> も一緒に出てしまう（issue 017 の 2 回目の不具合。HeaderCountTest が確かめる）。HTML の改行・空白を足さない（HeaderMarkupTest が一続きの形を確かめる） */-->
<th:block th:fragment="brand"><a class="brand" th:href="@{/}"><span class="brand-logo"><th:block th:replace="~{fragments/icons :: icon('logo', 18, 2)}"></th:block></span><span class="brand-name">家計・予実管理</span></a></th:block>

<!--/* 成功メッセージ・エラーメッセージの表示場所（画面の上部、2.3）。
     Controller が、messages.properties のキーを successMessageKey / errorMessageKey で渡す */-->
<div th:fragment="messages">
    <div class="message success alert alert-success" th:if="${successMessageKey}" th:text="${#messages.msg(successMessageKey)}">成功メッセージ</div>
    <div class="message error alert alert-danger" th:if="${errorMessageKey}" th:text="${#messages.msg(errorMessageKey)}">エラーメッセージ</div>
</div>

</body>
</html>
