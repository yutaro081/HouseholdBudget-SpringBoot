<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('アカウント登録')}"></head>
<body>
<main class="narrow">
    <h1>アカウント登録</h1>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>
        <div class="field">
            <label for="username">ユーザー名（半角英数字、10文字以内）</label>
            <input type="text" th:field="*{username}" autofocus>
            <!--/* 項目のエラーは、すべて項目の横（真下）に表示する（6.9） */-->
            <div class="field-error" th:each="message : ${#fields.errors('username')}" th:text="${message}">エラー</div>
        </div>
        <div class="field">
            <label for="password">パスワード（半角の英数字と記号、8〜30文字）</label>
            <!--/* 入力エラーで戻ったとき、パスワードは残さない */-->
            <input type="password" th:field="*{password}">
            <div class="field-error" th:each="message : ${#fields.errors('password')}" th:text="${message}">エラー</div>
        </div>
        <button type="submit">登録</button>
    </form>

    <p><a th:href="@{/login}">ログイン</a></p>
</main>
</body>
</html>
