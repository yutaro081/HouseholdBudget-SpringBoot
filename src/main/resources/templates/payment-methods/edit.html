<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('支払方法の変更')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<main class="narrow">
    <div th:replace="~{fragments/common :: messages}"></div>

    <h1>支払方法の変更</h1>

    <!--/* 今の名前の入ったフォーム。入力エラー・重複のときは、この画面を表示し直し、入力値とエラーを入れる（設計書 6.9） */-->
    <form th:action="@{/payment-methods/{id}/edit(id=${paymentMethodId})}" th:object="${paymentMethodForm}" method="post" novalidate>
        <div class="field">
            <label for="name">支払方法名（10文字以内）</label>
            <input type="text" th:field="*{name}" autofocus>
            <div class="field-error" th:each="message : ${#fields.errors('name')}" th:text="${message}">エラー</div>
        </div>
        <button type="submit">変更</button>
    </form>

    <p><a th:href="@{/payment-methods}">戻る</a></p>
</main>
</body>
</html>
