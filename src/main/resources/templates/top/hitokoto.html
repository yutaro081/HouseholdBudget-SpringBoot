<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  トップの「きょうのひとこと」の枠（設計書 2.3、5.12、issue 016）。top/index.html から差し込む。
  ・値はすべて HitokotoView（Controller が Service から受け取る）。ここでは計算しない。
  ・文面（名前・読み・文）はアプリの中のファイルの文。科目名はグラフへのひとことの引数として th:text で出す。th:utext は使わない。
  ・style 属性・JavaScript・外部の URL は使わない。
  ・何も出すものがなければ、枠ごと出さない。
*/-->
<th:block th:fragment="frame(h)">
    <section class="hitokoto-frame" aria-labelledby="hitokoto-heading"
             th:if="${h != null and h.hasContent()}">
        <h2 id="hitokoto-heading">きょうのひとこと</h2>

        <div class="hitokoto-item" th:each="item : ${h.items}">
            <p class="hitokoto-label">
                <span th:text="#{${'hitokoto.kind.' + item.kind.name()}}">七十二候</span>
                <strong th:text="${item.name}">山茶始開</strong><span th:if="${item.reading != null}" th:text="|（${item.reading}）|">（つばきはじめてひらく）</span>
            </p>
            <p class="hitokoto-text" th:text="${item.text}">文</p>
        </div>

        <p class="hitokoto-next" th:if="${h.nextSekki != null}"
           th:text="|次の節気：${h.nextSekki.name}まであと${h.nextSekki.days}日|">次の節気：小雪まであと14日</p>

        <p class="hitokoto-graph" th:if="${h.graph != null}"
           th:text="#{${h.graph.key}(${h.graph.arg0}, ${h.graph.arg1})}">今週いちばん多いのは食費（4,500円）です。</p>
    </section>
</th:block>
</body>
</html>
