# テストのときだけ読まれる設定（issue 032 の段階 0）。
# src/main/resources/application.properties を隠さないよう、名前の同じファイルではなく config/ の下に置く
# （Spring Boot は classpath:/ と classpath:/config/ の両方を読み、config/ の値が優先される。ここに書いた項目だけが上書きされる）。
# アプリを起動したとき（mvnw spring-boot:run）は、テストのファイルは読まれないので、本体の接続の数は変わらない。

# テストの Spring の準備（ApplicationContext）は 14〜15 種類あり、準備ごとに接続の入れ物（HikariPool）を 1 つ持つ。
# 標準（最大 10 本、最初から 10 本を持つ）だと、合わせて 150 本ほどになり、MySQL の標準の上限 151 本に余裕がない（issue 020）。
# テストは 1 つずつ順に動き（並列にしていない）、1 つのテストが同時に使う接続は 1 本（別のトランザクションを開く所・別のスレッドはない）。
# 1 本だけだと、将来 2 本目が要る処理を足したときに待ちで止まるので、1 本の余裕を足して 2 本にする。
spring.datasource.hikari.maximum-pool-size=2
# 使っていない接続を、最初から持っておかない（要るときに開く）。
spring.datasource.hikari.minimum-idle=0
